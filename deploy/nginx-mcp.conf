# Reverse proxy for the remote Teamleader MCP server.
#
# Install to /etc/nginx/sites-available/teamleader-mcp and symlink into
# sites-enabled, then run:
#   certbot --nginx -d mcp.von-falken.de
# certbot adds the listen 443 / ssl_certificate lines and the renewal timer.
#
# Do NOT put a redirect to a different host in front of this. Claude follows
# redirects but drops the Authorization header on a cross-host hop, which
# surfaces later as "Authorization with the MCP server failed".

server {
    listen 80;
    listen [::]:80;
    server_name mcp.von-falken.de;

    # certbot's webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.von-falken.de;

    # ssl_certificate / ssl_certificate_key are managed by certbot.

    access_log /var/log/nginx/teamleader-mcp.access.log;
    error_log  /var/log/nginx/teamleader-mcp.error.log;

    # MCP request bodies are small; this only needs to exceed the app's 4 MB limit.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # The app derives nothing from these except the client IP used for rate
        # limiting and the request log, but both matter for debugging.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Claude allows 10s for discovery/registration/token and 30s for
        # refresh; tool calls hitting the Teamleader API can take longer.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Never buffer: if the SSE transport is ever enabled, buffering here
        # silently breaks it.
        proxy_buffering off;
        proxy_cache off;
    }

    # Optional hardening. Anthropic's connector traffic comes from
    # 160.79.104.0/21 (https://platform.claude.com/docs/en/api/ip-addresses).
    # Restricting the MCP endpoint to that range is safe, but /authorize and
    # /consent are opened from YOUR browser, so they must stay reachable.
    # Uncomment and add your own address to use it.
    #
    # location = /mcp {
    #     allow 160.79.104.0/21;
    #     allow <your.own.ip.here>;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8787;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_buffering off;
    # }
}
