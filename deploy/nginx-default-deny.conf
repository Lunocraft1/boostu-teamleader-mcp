# Catch-all for requests whose Host header matches no configured site.
#
# Install to /etc/nginx/sites-available/000-default-deny and symlink into
# sites-enabled.
#
# Without a block that declares default_server, nginx promotes the first server
# block in the merged configuration to be the default, and it then receives all
# traffic aimed at the bare IP address — internet-wide scanners included. On a
# host where sites-enabled is loaded alphabetically, adding a vhost can silently
# make it the catch-all. Named vhosts are unaffected by this block: they still
# match on server_name.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
